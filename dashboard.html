<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kata Training Hub — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    :root {
      --bg:       #080810;
      --surface:  #0e0e1c;
      --surface2: #141428;
      --border:   #1e1e38;
      --accent:   #e94560;
      --gold:     #f0a500;
      --teal:     #00c9a7;
      --text:     #e8e8f0;
      --text-dim: #6060a0;
      --text-mid: #9090b8;
      --success:  #4caf50;
      --font-display: 'Bebas Neue', sans-serif;
      --font-mono:    'DM Mono', monospace;
      --font-body:    'DM Sans', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── noise texture overlay ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ─── layout ─── */
    .shell { position: relative; z-index: 1; }

    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, rgba(233,69,96,0.06) 0%, transparent 60%);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .logo {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .last-updated {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    .refresh-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-mid);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.2s;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    main { padding: 36px 40px; max-width: 1600px; margin: 0 auto; }

    /* ─── hero strip ─── */
    .hero {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      opacity: 0.5;
    }

    .hero-card.gold::before { background: var(--gold); }
    .hero-card.teal::before { background: var(--teal); }

    .hero-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .hero-value {
      font-family: var(--font-display);
      font-size: 52px;
      line-height: 1;
      color: var(--text);
      letter-spacing: 1px;
    }

    .hero-value .unit {
      font-size: 20px;
      color: var(--text-dim);
      margin-left: 4px;
    }

    .hero-sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      font-family: var(--font-mono);
    }

    /* ─── main grid ─── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .grid-13 {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .grid-31 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    /* ─── cards ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      animation: fadeUp 0.5s ease both;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .card-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      background: var(--surface2);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* ─── overall progress bar ─── */
    .big-progress {
      margin-bottom: 28px;
    }

    .big-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .big-progress-title {
      font-family: var(--font-display);
      font-size: 36px;
      letter-spacing: 1px;
    }

    .big-progress-pct {
      font-family: var(--font-display);
      font-size: 48px;
      color: var(--accent);
    }

    .big-bar {
      height: 12px;
      background: var(--surface2);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .big-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ff7096);
      border-radius: 6px;
      transition: width 1s ease;
      position: relative;
    }

    .big-bar-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 4px;
      background: white;
      opacity: 0.5;
      border-radius: 2px;
    }

    .big-progress-sub {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      font-family: var(--font-mono);
    }

    /* ─── form list ─── */
    .form-list { display: flex; flex-direction: column; gap: 0; }

    .form-item {
      display: grid;
      grid-template-columns: 28px 1fr 80px 70px;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      transition: background 0.15s;
    }

    .form-item:last-child { border-bottom: none; }
    .form-item:hover { background: rgba(255,255,255,0.02); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }
